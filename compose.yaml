services:
  app:
    image: ${APP_IMAGE:-ghcr.io/f4brici0l4yme/fetcher-n-sender-unsa:latest}
    build: .
    init: true
    shm_size: 1gb
    security_opt:
      - seccomp=./docker/chromium-seccomp.json
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/sesion').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      TZ: America/Lima
      DATABASE_URL: postgresql://fetcher:${POSTGRES_PASSWORD:-fetcher_dev}@db:5432/fetcher
      UPLOAD_DIR: /data/uploads
      PROOF_DIR: /data/uploads/proofs
      SESSION_DIR: /sessions
      DISPLAY: :99
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://127.0.0.1:${APP_PORT:-3000}}
      MCP_INBOX_DIR: /inbox
      LOGIN_VIEWER_PORT: ${LOGIN_VIEWER_PORT:-6080}
      AULA_CAPTURE_MODE: ${AULA_CAPTURE_MODE:-browser}
      AULA_PORTAL_URL: ${AULA_PORTAL_URL:-}
      AULA_PORTAL_ACCOUNT: ${AULA_PORTAL_ACCOUNT:-}
      AULA_ACCOUNT_ID: ${AULA_ACCOUNT_ID:-}
      AULA_AUTO_SYNC_INTERVAL_SECONDS: ${AULA_AUTO_SYNC_INTERVAL_SECONDS:-180}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
      - "127.0.0.1:${LOGIN_VIEWER_PORT:-6080}:6080"
    volumes:
      - uploads:/data
      - sessions:/sessions
      - ./entregas:/inbox:ro

  db:
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_DB: fetcher
      POSTGRES_USER: fetcher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fetcher_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  uploads:
  sessions:
  postgres_data:
